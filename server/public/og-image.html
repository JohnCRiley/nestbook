<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #405440;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 68px 80px;
  }

  /* Decorative arcs — mirror the flyer style */
  .arc {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .arc-1 {
    width: 780px;
    height: 780px;
    border: 110px solid rgba(255,255,255,0.045);
    top: -280px;
    right: -200px;
  }
  .arc-2 {
    width: 460px;
    height: 460px;
    border: 70px solid rgba(255,255,255,0.03);
    bottom: -180px;
    left: -100px;
  }
  .arc-3 {
    width: 240px;
    height: 240px;
    border: 40px solid rgba(255,255,255,0.025);
    bottom: 60px;
    right: 80px;
  }

  /* Content layers above the arcs */
  .top, .middle, .bottom { position: relative; z-index: 1; }

  /* Brand row */
  .brand {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .brand svg {
    width: 70px;
    height: 70px;
    flex-shrink: 0;
  }
  .brand-name {
    font-size: 58px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -1.5px;
    line-height: 1;
  }

  /* Tagline */
  .tagline {
    font-size: 40px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.88);
    line-height: 1.28;
    letter-spacing: -0.3px;
    max-width: 760px;
  }

  /* Bottom URL */
  .url {
    font-size: 26px;
    font-weight: 700;
    color: #f0ede8;
    letter-spacing: 0.02em;
  }
</style>
</head>
